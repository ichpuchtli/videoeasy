[project]
name = "videoeasy"
version = "0.1.0"
description = "AI-assisted documentary editing: footage ingest, deep shot annotation, and a footage bible for story work"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "rich>=13.0",
    "scenedetect[opencv]>=0.6.4",
    "opencv-python>=4.10",
    "numpy>=1.26",
    "pillow>=10.0",
    "python-docx>=1.1",
    "mlx-whisper>=0.4",
]

[project.scripts]
videoeasy = "videoeasy.cli:app"

[project.optional-dependencies]
birds = [
    "birdnet>=1.1.1",
]
species = [
    "pybioclip>=2.1.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/videoeasy"]
